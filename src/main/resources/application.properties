
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.show_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.enabled=true

project.football-data.api-token=${FOOTBALL_API_KEY:}
project.sync.scheduler-delay-ms=300000
project.sync.max-sincronizacoes-por-ciclo=3

project.premium.min-palpites=50
project.premium.min-grupos=3
project.premium.min-requisicoes=100
project.premium.min-acertos=10
project.premium.scheduler-delay-ms=300000